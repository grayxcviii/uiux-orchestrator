# uiux-orchestrator skill registry. Schema: core/skill-registry.md
# Read only the entries you shortlisted (search "id: <provider>/<skill>") plus their provider block.
# Facts below were verified against each skill's SKILL.md on verified_on; re-check on version drift.

schema_version: 1

providers:

  # ───────────────────────────── Impeccable ─────────────────────────────
  - provider: impeccable
    source: https://github.com/pbakaus/impeccable
    verified_version: "4.8.0"
    verified_on: 2026-11-06
    install_hint: "npx impeccable install"
    shared:
      required_inputs: ["command", "target path", "surface mode (Operate/Persuade/Read/Experience)", "refinement vs. replace", "decisions already made"]
      names: [impeccable]                 # one skill; commands are passed as the first argument
      kind: command
      invocation: model
      platforms: [web, ios, android, react-native, flutter]   # native via reference/ios.md, android.md
      frameworks: [any]
      requires:
        - "runs <skill-dir>/scripts/impeccable context once per session (self-contained binary, downloaded on first run); if refused, the skill reads PRODUCT.md/DESIGN.md directly"
      side_effects:
        - "may create or update PRODUCT.md, DESIGN.md (+ sidecar) and surface briefs in the project"
        - "first launcher run downloads a binary"
      limitations:
        - "`impeccable detect` on source files (JSX/TSX) runs pattern rules only; rendered checks (contrast, tiny text) need a URL scan of the running page. A clean source scan is not a pass (README, 4.8.0)."
      notes: >-
        Without a command it shows a menu and never auto-runs — always pass a command.
        Vocabulary: Impeccable "refinement" keeps identity; Impeccable "redesign" replaces the
        visual world and DESIGN.md. Map orchestrator Redesign/Refresh to refinement commands;
        only Redesign/Replace may use new-work. Modes: Persuade (marketing), Operate (app UI),
        Read (docs), Experience (portfolio) — choose from the surface.
      brief: >-
        Invoke with "<command> <target path>" (never bare). State the mode (Operate for app UI) and
        "refinement: keep tokens/components/identity" unless Redesign/Replace. Run its context
        launcher once (allowed: stays in its folder); if it wants to create PRODUCT.md/DESIGN.md in a
        refinement or read-only task, skip and say so. Read craft-floor.md before edits (its rule).
        Evaluate commands (critique/audit) return findings; merge them into the orchestrator's
        severity scale.
    skills:
      - id: impeccable/new-work
        names: [impeccable]               # invoked as a general new-surface request, or `shape` then new-work
        role: driver
        cost: heavy
        slots: [visual-direction, design-system]
        authority: {visual-direction: high, layout: high, typography: high, color: high}
        capabilities: [choose a visual world for a new surface, mode-aware direction, build with craft floor, verify rendered result]
        use_when: [new surface with no incumbent system, Redesign/Replace confirmed by user, marketing page when Taste is unavailable or unsuitable]
        requires: ["its launcher requires init (PRODUCT.md interview) before a new surface; plan the interview into the question batch"]
        side_effects: ["writes PRODUCT.md (init) and, on approval, DESIGN.md", "concept seeding contacts a remote API (network) per new-work.md 4.8.0", "may start a local decision page server (needs a free port and the user)"]
        notes: "Mapping: new surface inside the project's existing system → Impeccable 'surface inside an established world' (extend tokens); Redesign/Replace → 'new world'."
        avoid_when: [Redesign/Refresh or improvement inside an existing design system, another driver already owns the surface]
        owns: [visual-direction, design-system, typography, color, layout, polish]
        expected_outputs: [direction decisions, implemented surface, DESIGN.md]
        priority: recommended
        value_if_missing: high
      - id: impeccable/shape
        names: [impeccable]
        role: specialist
        slots: [research-foundation, ux-analysis, design-reasoning]
        authority: {ux: high}
        capabilities: [plan UX/UI before code, task discovery, context discovery]
        use_when: ["primary owner of ux-analysis for Medium+ and full-design work, after UUPM research", new screen or flow with unclear structure]
        avoid_when: [Small tasks, structure already defined by user or spec, "replacing specialized lookups (charts, fonts, stack guidance)"]
        expected_outputs: ["UX plan: users, main tasks, information hierarchy, flows, states and edge cases, success criteria"]
        priority: recommended
        value_if_missing: low
      - id: impeccable/critique
        names: [impeccable]
        role: reviewer
        cost: heavy
        brief: >-
          Its contract (critique.md, 4.8.0): Assessment A (design review) and B (detector + browser
          evidence) as two isolated sub-agents when a sub-agent tool exists; B is skipped on native.
          Run that core. Skip snapshot persistence (.impeccable/ writes) in read-only or refinement
          tasks and the live-server overlay when no mutable browser tab is available; report both as
          skipped. In non-interactive runs close with its own "Questions skipped: <reason>" line and
          continue with the orchestrator's workflow. Start drafting other steps while A/B run.
        slots: [ux-critique, platform-conformance]
        authority: {ux-critique: high, visual-hierarchy: high, platform-conformance: medium}
        capabilities: [heuristic UX critique with scoring, web and native]
        use_when: [review requests, auditing current UI before redesign or improvement]
        avoid_when: [bug with known cause, token-level change]
        expected_outputs: [scored findings]
        priority: recommended
        value_if_missing: high
      - id: impeccable/audit
        names: [impeccable]
        role: reviewer
        cost: medium
        slots: [tech-audit]
        authority: {tech-audit: high, accessibility: high, performance: medium, responsive: medium}
        capabilities: [technical checks a11y/perf/responsive, "native code-level variant (audit.native.md)"]
        use_when: [review or accessibility workflows, pre-ship check on Medium+ tasks]
        avoid_when: [Small tasks with a fast-path check]
        expected_outputs: [findings by severity]
        priority: recommended
        value_if_missing: high
      - id: impeccable/polish
        names: [impeccable]
        expected_outputs: ["final-pass refinements"]
        role: specialist
        slots: [polish]
        authority: {polish: high}
        capabilities: [final quality pass before shipping]
        use_when: [end of design/redesign/improvement on Medium+ tasks]
        avoid_when: [review-only, bug fix]
        priority: recommended
        value_if_missing: low
      - id: impeccable/typeset
        names: [impeccable]
        capabilities: ["type hierarchy, scale and font choices"]
        expected_outputs: ["typography changes"]
        role: specialist
        slots: [typography]
        authority: {typography: high}
        use_when: [hierarchy or font problems in existing UI]
        avoid_when: [typography fixed by an existing type scale the user wants kept]
        priority: optional
        value_if_missing: low
      - id: impeccable/colorize
        names: [impeccable]
        capabilities: ["strategic color within the brand"]
        expected_outputs: ["color/token changes"]
        role: specialist
        slots: [color]
        authority: {color: high}
        use_when: ["the user or brand asks for more color", "a monochrome UI lacks a functional accent (state, primary action)"]
        avoid_when: [brand palette fixed and adequate, "the premium monochrome posture applies and nobody asked for more color", "adding AI-generated color signatures"]
        priority: optional
        value_if_missing: low
      - id: impeccable/layout
        names: [impeccable]
        capabilities: ["spacing, rhythm and hierarchy fixes"]
        expected_outputs: ["layout changes"]
        role: specialist
        slots: [layout]
        authority: {layout: high, spacing: high}
        use_when: [spacing, rhythm or hierarchy problems]
        priority: optional
        value_if_missing: low
      - id: impeccable/adapt
        names: [impeccable]
        expected_outputs: ["layout changes per breakpoint/size class"]
        role: specialist
        slots: [responsive]
        authority: {responsive: high}
        capabilities: [adapt to devices/screen sizes, "native variant (adapt.native.md)"]
        use_when: [multi-breakpoint or device-class work with unclear approach]
        avoid_when: [single overflow bug with evident cause]
        priority: optional
        value_if_missing: low
      - id: impeccable/harden
        names: [impeccable]
        expected_outputs: ["error/edge-case/i18n fixes"]
        role: specialist
        slots: [hardening]
        authority: {edge-cases: high}
        capabilities: [errors, i18n, edge cases, production readiness]
        use_when: [new screens before ship, error/empty states missing]
        priority: optional
        value_if_missing: low
      - id: impeccable/clarify
        names: [impeccable]
        capabilities: ["rewrite labels, errors, empty states"]
        expected_outputs: ["copy changes"]
        role: specialist
        slots: [ux-copy]
        authority: {copy: high}
        use_when: [labels, errors, empty-state copy unclear]
        avoid_when: [factual or legal copy the user owns]
        priority: optional
        value_if_missing: low
      - id: impeccable/onboard
        names: [impeccable]
        capabilities: ["first-run flows, empty states, activation"]
        expected_outputs: ["onboarding/empty-state design and changes"]
        role: specialist
        slots: [ux-analysis]
        authority: {onboarding: high}
        use_when: ["gap filling after Impeccable shape: first-run flows, empty states, activation"]
        avoid_when: ["repeating UUPM research or redoing shape's overall UX plan"]
        priority: optional
        value_if_missing: low
      - id: impeccable/animate
        names: [impeccable]
        capabilities: ["purposeful motion within an Impeccable-driven build"]
        expected_outputs: ["motion changes"]
        role: specialist
        slots: [motion-build]
        authority: {motion: medium}
        use_when: [Impeccable already drives the surface and motion is part of its build]
        avoid_when: [Emil animate or animate-expo available and motion is the main task]
        priority: optional
        value_if_missing: low
      - id: impeccable/optimize
        names: [impeccable]
        capabilities: ["UI performance diagnosis and fixes"]
        expected_outputs: ["performance findings and fixes"]
        role: specialist
        slots: [motion-performance]
        authority: {performance: medium}
        use_when: [UI performance diagnosis without a platform-specific skill]
        priority: optional
        value_if_missing: low
      - id: impeccable/tone
        names: [impeccable]
        expected_outputs: ["visual adjustments in the requested direction"]
        role: specialist
        slots: [visual-direction]
        authority: {visual-direction: medium}
        capabilities: ["bolder: amplify bland UI", "quieter: tone down loud UI", "distill: remove complexity", "delight / overdrive: personality and spectacle"]
        use_when: [user asks to make UI bolder, calmer, simpler, more playful]
        avoid_when: ["delight/overdrive on Operate surfaces (dashboards, settings) unless asked"]
        priority: optional
        value_if_missing: low
      - id: impeccable/document
        names: [impeccable]
        expected_outputs: ["DESIGN.md derived from code"]
        role: specialist
        slots: [design-system]
        authority: {design-system: high}
        capabilities: ["document: DESIGN.md from existing code", "extract: pull tokens/components into the system"]
        use_when: [design-system document or extract, "recording a system after it was created and implemented"]
        notes: "Records/normalizes an existing system; never counts as design-system creation (decision-engine §3, Ownership by stage)."
        avoid_when: [project already maintains a design system doc in another format the user wants kept]
        side_effects: [writes DESIGN.md]
        priority: recommended
        value_if_missing: low
      - id: impeccable/live
        names: [impeccable]
        expected_outputs: ["variants in the running app to choose from"]
        role: specialist
        slots: [design-exploration]
        platforms: [web]
        capabilities: ["live: pick elements in the browser and iterate variants", "generate: n variants of a named element"]
        use_when: [design exploration on a running web app]
        requires: [running dev server, browser]
        priority: optional
        value_if_missing: low

  # ───────────────────────────── UI UX Pro Max ─────────────────────────────
  - provider: uupm
    source: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
    verified_version: "b7d5353"
    verified_on: 2026-11-06
    install_hint: "/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill · /plugin install ui-ux-pro-max@ui-ux-pro-max-skill"
    shared:
      names: [ui-ux-pro-max, "ui-ux-pro-max:ui-ux-pro-max"]
      kind: tool
      invocation: model
      platforms: [web, react-native, ios, android, flutter]
      requires: ["python3 (no packages)", "run scripts/search.py by the skill's absolute path"]
      limitations:
        - "stack guides: react, nextjs, vue, svelte, astro, nuxtjs, nuxt-ui, angular, laravel, swiftui, react-native, flutter, jetpack-compose, html-tailwind, shadcn, threejs + desktop; no UIKit or Android Views"
        - "results are recommendations; a 0-result search must be reported as built-in defaults, never as data"
      notes: "One dominant intent, 2-5 terms per query. Sibling skills design, brand, banner-design, slides, design-system, ui-styling are not registered (logo/CIP/banners/decks/shadcn styling out of scope or duplicated)."
    skills:
      - id: uupm/search
        required_inputs: ["one design question as 2-5 terms", "domain and/or detected stack"]
        role: specialist
        slots: [research-foundation, ux-analysis, typography, color, layout, data-visualization]
        authority: {ux-guidelines: medium, color: medium, typography: medium, data-visualization: high}
        capabilities: ["--domain ux|color|typography|google-fonts|chart|landing|icons|style|product|gsap|react|web", "--stack <stack> implementation guidance", "--rtl"]
        use_when: [one targeted design question the project does not answer, chart type choice (default-on when the user asks which chart), font pairing for a new surface, RTL support]
        avoid_when: [question already settled by project tokens or an earlier handoff decision, "deciding the final UX flow (Impeccable shape owns UX analysis on Medium+ when available)", "choosing the final palette/type/design system (provisional reference only; art direction decides)"]
        expected_outputs: [ranked recommendations with rationale]
        brief: >-
          One query per question: python3 -I <skill-dir>/scripts/search.py "<2-5 terms>" --domain <d>
          [--stack <detected>]. Check the top result fits product and platform; retry once narrower;
          0 results → say "built-in default". Never --persist or --force without user consent.
        priority: recommended
        value_if_missing: low
      - id: uupm/design-system
        required_inputs: ["product type, industry, keywords", "project name", "persist location (only with consent)"]
        expected_outputs: ["pattern, style, palette, typography, effects, anti-patterns (optionally MASTER.md)"]
        role: driver
        slots: [visual-direction, design-system]
        authority: {visual-direction: medium, color: high, typography: high}
        capabilities: ["--design-system: product type → pattern, style, palette, typography, effects, anti-patterns", "dials --variance --motion --density", "--persist writes design-system/<slug>/MASTER.md (+ pages/)"]
        use_when: [new product or page with no design system, user wants a data-backed direction for app UI]
        avoid_when: ["existing tokens/design system (Refresh, improvement, bug fix)", another driver owns the surface]
        side_effects: ["--persist writes design-system/<slug>/; never pass --force without user authorization"]
        owns: [visual-direction, design-system, color, typography]
        priority: recommended
        value_if_missing: low

  # ───────────────────────────── Taste ─────────────────────────────
  - provider: taste
    source: https://github.com/Leonxlnx/taste-skill
    verified_version: "2.5.0"
    verified_on: 2026-11-06
    install_hint: 'npx skills add https://github.com/Leonxlnx/taste-skill --skill "design-taste-frontend"'
    skills:
      - id: taste/design-taste-frontend
        names: [design-taste-frontend, "taste-skill:design-taste-frontend"]
        required_inputs: ["business kind, what is sold, main action", "real content and assets", "authorization for necessary kit files in the target surface"]
        expected_outputs: ["built marketing page from its kit", "checker, layout and perf results"]
        kind: skill
        role: driver
        cost: heavy
        invocation: model
        slots: [visual-direction]
        authority: {marketing-visual-direction: high, marketing-copy: high}
        platforms: [web]
        frameworks: [any]
        capabilities: ["company/marketing website pipeline by business kind (software, gaming, tech, product, service, place)", dealt palettes/fonts/heroes, real photographs and brand icons, 100+ headless browser checks at 1440/1024/820/768/390, perf checks]
        use_when: [new or fully replaced landing/company/product/shop/venue website, "'looks generic / AI-made' on a marketing page"]
        avoid_when: [app UI, dashboards, settings, forms-heavy product UI, native or RN or Flutter, refinement inside an existing site design system, "brand that uses violet/lavender (house rule forbids it)", page that needs scroll reveals/parallax, user unwilling to adopt its kit]
        requires: ["Node 22+", "Chrome, Edge or Chromium (CHROME_PATH)", "ffmpeg optional"]
        owns: [visual-direction, layout, typography, color, ux-copy, polish]
        brief: >-
          Probe Node ≥ 22 with the bundled probe-runtime.py: an installed alternate runtime counts.
          Invoke its absolute binary directly, without changing PATH, shell or global defaults. Check an installed
          Chrome/Edge/Chromium (default install path is enough; CHROME_PATH only if non-standard).
          If no compatible runtime is observed, eliminate it (do not install Node). Read actual house rules for brief fit;
          local kit copies inside an authorized new surface are ordinary implementation. Ask only for genuinely
          unauthorized side effects, not permission already implied by the build task. For a
          framework project, plan the port from its starter.html into components before building.
        side_effects: ["copies its assets/ kit into the project and starts from starter.html", "writes .taste-skill/ history files and names.json", "photo fetch may use network"]
        limitations: ["pipeline is built on its own HTML starter/system.css; no framework-porting guidance found — porting into Next.js/Vue components is manual work to plan for", "house rules: no captions, one section per screen, no scroll-reveal, never violet"]
        priority: recommended
        value_if_missing: low
        notes: "Before choosing: confirm prerequisites and that the user accepts the kit. Older Taste variants live in Leonxlnx/taste-skill-classics and are not registered."

  # ───────────────────────────── shadcn/ui ─────────────────────────────
  - provider: shadcn
    source: https://github.com/shadcn-ui/ui
    verified_version: "8ab2771"
    verified_on: 2026-11-11
    install_hint: "npx skills add shadcn-ui/ui@shadcn"
    skills:
      - id: shadcn/ui
        names: [shadcn]
        required_inputs: ["the needed component(s) from the component-intelligence contract", "framework, package manager and Tailwind setup", "accepted tokens/direction"]
        expected_outputs: ["components added through the shadcn CLI and composed in project code", "list of registry items added and customizations made"]
        kind: tool
        role: specialist
        invocation: model
        slots: [component-reference, design-system]
        authority: {component-implementation: high, design-system: medium}
        platforms: [web]
        frameworks: [react, nextjs]
        capabilities: ["search official and community registries before custom UI", "add/compose/fix/style components via CLI", "apply a DESIGN.md or brand spec as shadcn tokens", "Radix or Base UI primitives"]
        use_when: ["React project with components.json (shadcn initialized)", "new React + Tailwind surface where the user approves initializing shadcn"]
        avoid_when: ["project uses another component library (MUI, Chakra, Mantine…) — project truth wins", "non-React stacks", "native/RN/Flutter"]
        requires: ["node", "network for npx shadcn@latest and registries"]
        side_effects: ["SKILL.md runs `npx shadcn@latest info --json` for context when loaded in agents that support dynamic context", "CLI writes component source files and may edit CSS variables, components.json and dependencies"]
        limitations: ["presets/apply overwrite theme, fonts and detected components; never run apply/init on an existing system without permission", "default themes are neutral: map them to the accepted direction instead of shipping defaults"]
        brief: >-
          Pass the components needed and their contracts from references/component-intelligence.md.
          Search registries first, add with the project's package runner, compose existing
          components, keep semantic tokens mapped to the accepted direction (no raw colors), and
          verify every contract state. Never run init/apply/preset on an existing project without
          explicit permission.
        priority: recommended
        value_if_missing: medium

  # ───────────────────────────── Magic UI ─────────────────────────────
  - provider: magicui
    source: https://github.com/magicuidesign/magicui
    verified_version: "1ac985a"
    verified_on: 2026-11-11
    install_hint: "npx skills add magicuidesign/magicui"
    skills:
      - id: magicui/components
        names: [magic-ui]
        required_inputs: ["section/moment and the accepted motion signature", "React + Tailwind + shadcn status"]
        expected_outputs: ["Magic UI component(s) added via the shadcn registry and integrated", "which components were used and why each passes the motion filter"]
        kind: tool
        role: specialist
        invocation: model
        slots: [component-reference, motion-build]
        authority: {motion-components: medium}
        platforms: [web]
        frameworks: [react, nextjs]
        capabilities: ["animated React components through `npx shadcn@latest add @magicui/<slug>`", "section recipes (hero, feature grid, CTA, testimonials)"]
        use_when: ["React + Tailwind project with shadcn initialized (or approved) and a Persuade/Experience surface whose motion signature a Magic UI component implements"]
        avoid_when: ["the component is an AI-generated color or motion signature (shimmer/shiny/rainbow buttons, gradient or aurora text, glowing borders/beams, meteors, particles, confetti, typing text, endless logo marquee, counters on fake metrics) unless the user asked for it", "Operate surfaces where motion must stay quiet", "non-React stacks"]
        requires: ["node", "shadcn initialized", "network for the @magicui registry"]
        side_effects: ["adds component source files, keyframes and motion dependencies to the project"]
        limitations: ["React/Next.js + Tailwind only", "many showcase effects conflict with the AI-signature lists; apply the filter in references/component-intelligence.md"]
        brief: >-
          Use only components that pass the Magic UI filter in references/component-intelligence.md
          and implement the recorded motion signature. Keep props/className customization over
          rewrites, map colors to the accepted tokens, use the motion tokens, and keep a
          reduced-motion path. Never stack several high-motion effects in one viewport.
        priority: optional
        value_if_missing: low

  # ───────────────────────────── Emil Kowalski ─────────────────────────────
  - provider: emil
    source: https://github.com/emilkowalski/skills
    verified_version: "c8a7962"
    verified_on: 2026-11-06
    install_hint: "npx skills@latest add emilkowalski/skills"
    shared:
      required_inputs: ["target component/flow", "platform and installed motion stack", "reduced-motion requirement"]
      kind: skill
      role: specialist
      invocation: model
      frameworks: [any]
    skills:
      - id: emil/animate
        names: [animate, "emil:animate"]
        expected_outputs: ["decision record (purpose, tool, properties, curve/duration or spring, interruption, exit)", "implementation"]
        complements: [emil/choreograph]
        slots: [motion-build]
        authority: {motion: high}
        platforms: [web]
        capabilities: ["decision sequence: should it animate, purpose, cheapest tool (CSS transition → @starting-style → CSS animation → WAAPI → Motion), properties, curve/duration or spring, interruption/exit, reduced motion"]
        use_when: [new web animation or transition]
        avoid_when: [native/RN/Flutter, GSAP already chosen and only API help needed]
        delegates_to: [emil/pick-ui-library]
        limitations: ["does not cover GSAP; tool ladder ends at Motion"]
        brief: >-
          Give it: the element, the installed motion library, and "reduced motion required". Take
          back its decision record (purpose, tool, properties, curve/duration or spring, interruption,
          exit) into the handoff, then implement with the installed library.
        priority: recommended
        value_if_missing: high
      - id: emil/animate-expo
        names: [animate-expo, "emil:animate-expo"]
        expected_outputs: ["decision record", "Reanimated/Gesture Handler implementation (translated to the installed versions)"]
        equivalent_to: [expo/expo-animation]
        complements: [swm/react-native-best-practices]   # only for library API detail (Skia, layout animations) on New Architecture
        slots: [motion-build, motion-performance]
        authority: {motion: high}
        platforms: [react-native]
        capabilities: [RN/Expo motion decisions, Reanimated + Gesture Handler + Expo Router + expo-haptics implementation, thread placement, press feedback, haptics, reduced motion]
        use_when: [any animation or gesture work in RN/Expo]
        brief: >-
          Give it the Reanimated, Gesture Handler and RN versions and New Architecture status from the
          profile. Follow its build sequence; translate APIs when versions differ from its samples.
        avoid_when: [web, native iOS/Android, Flutter]
        limitations:
          - "code samples target Reanimated 4 + react-native-worklets (New Architecture) and Gesture Handler v2 (its RECIPES note the v3 hooks mapping). On Reanimated 3 (unmaintained) or old architecture: use its decisions only and translate APIs (scheduleOnRN → runOnJS, worklets package → reanimated built-ins); never upgrade without permission"
          - "recommends judging feel in a release build on the slowest device — state as a limitation if not possible"
        priority: recommended
        value_if_missing: high
      - id: emil/choreograph
        names: [choreograph]
        capabilities: ["sequence and overlap of several moving elements"]
        expected_outputs: ["choreography plan and implementation"]
        slots: [motion-build]
        authority: {motion-choreography: high}
        platforms: [web]
        use_when: ["several elements animating together: staggers", hero entrances, view swaps, multi-step flows]
        avoid_when: [single-element animation]
        priority: optional
        value_if_missing: low
      - id: emil/find-animation-opportunities
        names: [find-animation-opportunities]
        expected_outputs: ["proposals with exact values (no code changes)"]
        role: reviewer
        slots: [motion-discovery]
        authority: {motion: high}
        platforms: [web, react-native]
        capabilities: [read-only search for missing motion with exact values, rejects decorative motion]
        use_when: ["'make it feel alive', polish or redesign where motion value is unknown"]
        avoid_when: [user already specified the animation]
        priority: optional
        value_if_missing: low
        notes: "Examples are web-oriented; on RN translate values through animate-expo principles."
