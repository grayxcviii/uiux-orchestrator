name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spec, links, registry, slot index, scripts, plugin manifests
        run: python3 -I scripts/validate.py
      - name: npm installer
        run: npm test
      - name: Distribution licences and upstream notices
        run: python3 -I scripts/check_licenses.py
